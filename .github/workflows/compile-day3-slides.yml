name: Compile Day 3 slides

on:
  push:
    branches: [main]
    paths:
      - 'materials/slides/day03/PA311N-Day3-Exploratory-Data-Analysis.tex'
      - '.github/workflows/compile-day3-slides.yml'

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile LaTeX slides
        uses: xu-cheng/latex-action@v3
        with:
          root_file: PA311N-Day3-Exploratory-Data-Analysis.tex
          working_directory: materials/slides/day03
          latexmk_use_xelatex: false

      - name: Commit compiled PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials/slides/day03/PA311N-Day3-Exploratory-Data-Analysis.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Compile Day 3 exploratory data analysis slides"
            git push
          fi
