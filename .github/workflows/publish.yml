name: Publish Quarto website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: quarto-pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check lecture PDFs
        id: lecture-pdfs
        shell: bash
        run: |
          if [[ ! -f materials/slides/day06/PA311N-Day6-Normal-Binomial-Distributions.pdf || ! -f materials/slides/day07/PA311N-Day7-Sampling-Variability-CLT.pdf ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Compile Day 6 lecture PDF
        if: steps.lecture-pdfs.outputs.needed == 'true'
        uses: xu-cheng/latex-action@v4
        with:
          root_file: PA311N-Day6-Normal-Binomial-Distributions.tex
          working_directory: materials/slides/day06

      - name: Compile Day 7 lecture PDF
        if: steps.lecture-pdfs.outputs.needed == 'true'
        uses: xu-cheng/latex-action@v4
        with:
          root_file: PA311N-Day7-Sampling-Variability-CLT.tex
          working_directory: materials/slides/day07

      - name: Commit lecture PDFs
        if: steps.lecture-pdfs.outputs.needed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add materials/slides/day06/PA311N-Day6-Normal-Binomial-Distributions.pdf
          git add materials/slides/day07/PA311N-Day7-Sampling-Variability-CLT.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Build Day 6 and Day 7 lecture PDFs"
            git push
          fi

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages for Quarto
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown"))'

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
